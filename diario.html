<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Diário de bordo | Explorador do Universo</title>
  <meta name="description" content="Os astros que você descobriu no Explorador do Universo, com distâncias reais, ficha técnica, missões e desafios.">
  <meta name="theme-color" content="#02040b">

  <link rel="icon" href="img/icones/favicon.svg" type="image/svg+xml">
  <link rel="apple-touch-icon" href="img/icones/apple-touch-icon.png">
  <link rel="manifest" href="pwa/manifest.webmanifest">

  <link rel="stylesheet" href="css/base.css">
  <link rel="stylesheet" href="css/site.css">
  <link rel="stylesheet" href="css/diario.css">
</head>
<body class="site">
  <a class="pular-para-conteudo" href="#conteudo">Pular para o conteúdo</a>
  <header class="topo">
    <a class="marca" href="index.html">🔭 Explorador do Universo</a>
    <nav aria-label="Navegação principal">
      <a href="index.html">Início</a>
      <a href="explorador.html">Explorar</a>
      <a href="comparar.html">Comparar</a>
      <a href="diario.html" aria-current="page">Diário de bordo</a>
      <a href="sobre.html">Sobre</a>
    </nav>
  </header>

  <main id="conteudo" class="pagina diario">
    <div class="diario-cabeca">
      <div>
        <h1>📔 Diário de bordo</h1>
        <p class="subtitulo" id="resumo" aria-live="polite"></p>
      </div>
      <a class="botao botao-principal" href="explorador.html">🚀 Continuar explorando</a>
    </div>

    <div id="verbetes"></div>

    <details class="missoes">
      <summary>🏅 Missões <span id="contagem-missoes"></span></summary>
      <ol id="missoes"></ol>
    </details>

    <div class="acoes-dados">
      <button type="button" class="botao botao-pequeno" id="botao-exportar">⬇️ Baixar meu diário</button>
      <button type="button" class="botao botao-pequeno botao-perigo" id="botao-zerar">Recomeçar do zero</button>
      <p>O progresso fica só neste navegador.</p>
    </div>
  </main>

  <dialog class="dialogo-quiz" id="dialogo-quiz" aria-labelledby="quiz-pergunta">
    <form method="dialog">
      <p class="quiz-selo" id="quiz-selo">🧠 Desafio</p>
      <h2 id="quiz-pergunta">—</h2>
      <div class="quiz-opcoes" id="quiz-opcoes"></div>
      <p class="quiz-explicacao" id="quiz-explicacao" hidden></p>
      <button type="submit" class="botao botao-pequeno">Fechar</button>
    </form>
  </dialog>

  <footer class="rodape">
    <p>MVP do TCC de Sistemas de Informação · UNEMAT, campus Sinop · Davi Alves Mares</p>
  </footer>

  <script src="js/site.js" defer></script>
  <script type="module" src="js/diario.js"></script>
</body>
</html>
